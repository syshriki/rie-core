openapi: 3.0.3
info:
  title: RIE Server API
  description: Recipe Information Exchange Server
  version: 1.0.0
servers:
  - url: http://localhost:8001
    description: Development
security: []
tags:
  - name: Users
    description: User management and profiles
  - name: Recipes
    description: Recipe CRUD and favorites
  - name: News
    description: News feed
  - name: Anonymous
    description: Public endpoints (no authentication required)
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: JWT stored in an httpOnly cookie
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT passed via Authorization header
  parameters:
    userId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: User ID
    slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        minLength: 2
        maxLength: 100
      description: Recipe slug
    authorId:
      name: authorId
      in: path
      required: true
      schema:
        type: string
      description: Author user ID
    q:
      name: q
      in: query
      required: false
      schema:
        type: string
        default: ''
      description: Search term for filtering by title or description
    cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        nullable: true
      description: Cursor for cursor-based pagination
    page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
      description: Page number for page-based pagination (cannot use with cursor)
    pageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 100
      description: Number of items per page
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
        code:
          type: string
      required:
        - message

    UserEntity:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        createdAt:
          type: integer
      required:
        - id
        - username
        - createdAt

    UserProfile:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        createdAt:
          type: integer
        recipeCount:
          type: integer
        favoriteCount:
          type: integer
      required:
        - id
        - username
        - createdAt
        - recipeCount
        - favoriteCount

    UserCreateInput:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
      required:
        - id

    RecipeEntity:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        ingredients:
          type: string
          nullable: true
        recipe:
          type: string
        authorId:
          type: string
        createdAt:
          type: integer
        updatedAt:
          type: integer
      required:
        - id
        - slug
        - title
        - recipe
        - authorId
        - createdAt
        - updatedAt

    RecipeOutput:
      allOf:
        - $ref: '#/components/schemas/RecipeEntity'
        - type: object
          properties:
            isFavorite:
              type: boolean
          required:
            - isFavorite

    RecipeWithAuthor:
      allOf:
        - $ref: '#/components/schemas/RecipeOutput'
        - type: object
          properties:
            authorUsername:
              type: string
          required:
            - authorUsername

    RecipeWithAuthorAnon:
      allOf:
        - $ref: '#/components/schemas/RecipeEntity'
        - type: object
          properties:
            authorUsername:
              type: string
          required:
            - authorUsername

    RecipesCursorResponse:
      type: object
      properties:
        recipes:
          type: array
          items:
            $ref: '#/components/schemas/RecipeOutput'
        hasMore:
          type: boolean
        nextCursor:
          type: integer
          nullable: true
      required:
        - recipes
        - hasMore
        - nextCursor

    RecipesPageResponse:
      type: object
      properties:
        recipes:
          type: array
          items:
            $ref: '#/components/schemas/RecipeOutput'
        pagination:
          $ref: '#/components/schemas/PaginationInfo'
      required:
        - recipes
        - pagination

    RecipesCursorResponseAnon:
      type: object
      properties:
        recipes:
          type: array
          items:
            $ref: '#/components/schemas/RecipeEntity'
        hasMore:
          type: boolean
        nextCursor:
          type: integer
          nullable: true
      required:
        - recipes
        - hasMore
        - nextCursor

    RecipesPageResponseAnon:
      type: object
      properties:
        recipes:
          type: array
          items:
            $ref: '#/components/schemas/RecipeEntity'
        pagination:
          $ref: '#/components/schemas/PaginationInfo'
      required:
        - recipes
        - pagination

    PaginationInfo:
      type: object
      properties:
        currentPage:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer
        totalItems:
          type: integer
        hasNextPage:
          type: boolean
        hasPreviousPage:
          type: boolean
      required:
        - currentPage
        - pageSize
        - totalPages
        - totalItems
        - hasNextPage
        - hasPreviousPage

    RecipeFavoriteEntity:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        recipeId:
          type: integer
        userId:
          type: string
        createdAt:
          type: integer
      required:
        - id
        - username
        - recipeId
        - userId
        - createdAt

    FavoritesResponse:
      type: object
      properties:
        recipes:
          type: array
          items:
            $ref: '#/components/schemas/RecipeOutput'
        hasMore:
          type: boolean
        nextCursor:
          type: integer
          nullable: true
      required:
        - recipes
        - hasMore
        - nextCursor

    UserRecipesResponse:
      type: object
      properties:
        recipes:
          type: array
          items:
            $ref: '#/components/schemas/RecipeOutput'
        hasMore:
          type: boolean
        nextCursor:
          type: integer
          nullable: true
      required:
        - recipes
        - hasMore
        - nextCursor

    UserRecipesResponseAnon:
      type: object
      properties:
        recipes:
          type: array
          items:
            $ref: '#/components/schemas/RecipeEntity'
        hasMore:
          type: boolean
        nextCursor:
          type: integer
          nullable: true
      required:
        - recipes
        - hasMore
        - nextCursor

    NewsEntity:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        text:
          type: string
        type:
          type: string
        authorId:
          type: string
        recipeSlug:
          type: string
          nullable: true
        createdAt:
          type: string
      required:
        - id
        - title
        - text
        - type
        - authorId
        - createdAt

    NewsListResponse:
      type: object
      properties:
        news:
          type: array
          items:
            $ref: '#/components/schemas/NewsEntity'
        hasMore:
          type: boolean
        nextCursor:
          type: string
          nullable: true
      required:
        - news
        - hasMore
        - nextCursor

    CreateRecipeBody:
      type: object
      required:
        - title
        - recipe
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        ingredients:
          type: string
        recipe:
          type: string

    UpdateRecipeBody:
      type: object
      required:
        - title
        - recipe
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        ingredients:
          type: string
        recipe:
          type: string

    CreateNewsBody:
      type: object
      required:
        - title
        - text
        - type
      properties:
        title:
          type: string
        text:
          type: string
        type:
          type: string
        recipeSlug:
          type: string
          nullable: true

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Not authorized to perform this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
paths: {}
