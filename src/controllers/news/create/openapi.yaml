/news:
  post:
    tags: [News]
    summary: Create a news item
    operationId: createNews
    security:
      - cookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateNewsBody'
    responses:
      '201':
        description: News item created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewsEntity'
      '400':
        $ref: '#/components/responses/BadRequest'
      '401':
        $ref: '#/components/responses/Unauthorized'
