/users:
  post:
    tags: [Users]
    summary: Create a new user from the authenticated JWT
    operationId: createUser
    security:
      - bearerAuth: []
    responses:
      '200':
        description: User created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserEntity'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '409':
        description: User ID already exists
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '500':
        description: Failed to generate unique username
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
